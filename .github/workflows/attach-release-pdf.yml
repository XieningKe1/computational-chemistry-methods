name: attach-release-pdf

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach PDF to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp main.pdf computational-chemistry-methods.pdf
          gh release upload v1.0-lecture-notes computational-chemistry-methods.pdf \
            --repo "$GITHUB_REPOSITORY" --clobber
